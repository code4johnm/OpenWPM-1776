# OpenWPM-1776 dashboard. replicas stays 0 in git.
# Launch from the k38 console, or: kubectl -n default scale deployment/openwpm-dashboard --replicas=1
# The page then creates Job openwpm-crawl when Launch crawl is clicked.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openwpm-dashboard
  namespace: default
  labels:
    app: openwpm-1776
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openwpm-dashboard
  namespace: default
  labels:
    app: openwpm-1776
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openwpm-dashboard
  namespace: default
  labels:
    app: openwpm-1776
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openwpm-dashboard
subjects:
  - kind: ServiceAccount
    name: openwpm-dashboard
    namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openwpm-dashboard
  namespace: default
  labels:
    app.kubernetes.io/name: openwpm-dashboard
    app: openwpm-1776
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: openwpm-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openwpm-dashboard
        app: openwpm-1776
    spec:
      serviceAccountName: openwpm-dashboard
      containers:
        - name: dashboard
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          workingDir: /opt/OpenWPM
          command: ["python3", "/opt/OpenWPM/dashboard/server.py"]
          env:
            - name: OPENWPM_ROOT
              value: /opt/OpenWPM
            - name: OPENWPM_HOST_ROOT
              value: /mnt/5TB/git/github/OpenWPM-1776
            - name: OPENWPM_DATADIR
              value: /opt/OpenWPM/datadir
            - name: OPENWPM_DASH_HOST
              value: 0.0.0.0
            - name: OPENWPM_DASH_PORT
              value: "8770"
          ports:
            - name: http
              containerPort: 8770
              hostPort: 8770
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: src
              mountPath: /opt/OpenWPM
      volumes:
        - name: src
          hostPath:
            path: /mnt/5TB/git/github/OpenWPM-1776
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: openwpm-1776
  namespace: default
  labels:
    app: openwpm-1776
spec:
  selector:
    app.kubernetes.io/name: openwpm-dashboard
  ports:
    - name: http
      port: 8770
      targetPort: http
